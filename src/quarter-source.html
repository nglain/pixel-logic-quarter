<div id="logic-quarter">

    <button class="qt-place" data-enter="bridge" style="left:8%;top:58%;width:36%;height:34%" hidden><span>Мост</span></button>
    <button class="qt-place" data-enter="lights" style="left:56%;top:58%;width:36%;height:34%" hidden><span>Свет погас</span></button>

  <section data-view="cafe" hidden>@@CAFE@@</section>

  </section>

<script>
(()=>{
const root=document.getElementById('logic-quarter'),q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
const titles={map:'Квартал загадок',cafe:'Кафе',safe:'Сейф',scales:'Весы',river:'Переправа'};
const help={map:'Нажми на здание. Звезда означает решённую задачу. В любое место можно вернуться.',cafe:'Нажми на автомат: одна проба стоит монету. Выбери содержимое А, Б и В. Условие о наклейках выбирается справа.',safe:'Три разные цифры от 0 до 5. Нажимай на цифры, затем «Открыть». ● — цифра на своём месте, ○ — есть в коде, но в другом месте. Всего 8 попыток.',scales:'Из 9 монет одна тяжелее. Два взвешивания. Выбери чашу стрелкой и нажимай на монеты. На чашах должно быть поровну монет. Чтобы дать ответ, нажми «Назвать монету», затем саму монету.',river:'Нажми на пассажира, затем на лодку. Фермер перевозит только одного. Без фермера волк съест козу, а коза — капусту. Можно плыть одному.'};
const clone=s=>JSON.parse(JSON.stringify(s)),pick=n=>Math.floor(Math.random()*n);

const levels={
cafe:[{mode:0,budget:3,name:'Неверные наклейки'},{mode:1,budget:3,name:'Одна правдивая'},{mode:2,budget:6,name:'Без гарантий'}],
safe:[{digits:2,max:3,limit:6,name:'Две цифры'},{digits:3,max:5,limit:8,name:'Три цифры'},{digits:4,max:5,limit:10,name:'Четыре цифры'}],
scales:[{coins:3,limit:1,unknown:false,name:'Три монеты'},{coins:9,limit:2,unknown:false,name:'Девять монет'},{coins:9,limit:3,unknown:true,name:'Легче или тяжелее?'}],
river:[{active:[2,3],limit:0,name:'Коза и капуста'},{active:[1,2,3],limit:0,name:'Волк, коза, капуста'},{active:[1,2,3],limit:7,name:'Ровно семь рейсов'}]
};
@@EXTRACODE@@
@@WAREHOUSE@@
@@HINTCODE@@
function newSafe(level=0){const c=levels.safe[level],a=Array.from({length:c.max+1},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=pick(i+1);[a[i],a[j]]=[a[j],a[i]];}return {secret:a.slice(0,c.digits),digits:a.slice(0,c.digits).map((_,i)=>i),log:[],solved:false,failed:false,message:''};}
function newScale(level=0){const c=levels.scales[level];return {heavy:pick(c.coins),delta:c.unknown?(pick(2)?1:-1):1,places:Array(c.coins).fill(0),tray:-1,log:[],answerMode:false,solved:false,failed:false,message:'Выбери чашу и монеты.'};}
function newRiver(){return {sides:[0,0,0,0],passenger:null,trips:0,solved:false,failed:false,message:'Выбери пассажира.'};}
function fresh(){return {version:2,revision:0,view:'map',mapPage:0,done:[],undo:[],...Object.fromEntries(extraIds.map(id=>[id,newExtra(id)])),progress:Object.fromEntries(Object.keys(levels).map(id=>[id,{level:0,cleared:0}])),safe:newSafe(),scales:newScale(),river:newRiver(),cafe:null};}
function valid(s){return s?.version===2&&titles[s.view]&&s.progress&&['cafe','safe','scales','river'].every(id=>Number.isInteger(s.progress[id]?.level)&&s.progress[id].level>=0&&s.progress[id].level<3&&Number.isInteger(s.progress[id].cleared)&&s.progress[id].cleared>=s.progress[id].level&&s.progress[id].cleared<=3)&&Array.isArray(s.done)&&s.safe?.secret?.length===levels.safe[s.progress.safe.level].digits&&s.safe.secret.every(x=>Number.isInteger(x)&&x>=0&&x<=levels.safe[s.progress.safe.level].max)&&new Set(s.safe.secret).size===s.safe.secret.length&&s.safe.digits?.length===s.safe.secret.length&&s.safe.digits.every(x=>Number.isInteger(x)&&x>=0&&x<=levels.safe[s.progress.safe.level].max)&&Array.isArray(s.safe.log)&&s.safe.log.length<=10&&Number.isInteger(s.scales?.heavy)&&s.scales.heavy>=0&&s.scales.heavy<levels.scales[s.progress.scales.level].coins&&[-1,1].includes(s.scales.delta)&&s.scales.places?.length===levels.scales[s.progress.scales.level].coins&&s.scales.places.every(x=>[-1,0,1].includes(x))&&Array.isArray(s.scales.log)&&s.scales.log.length<=3&&s.river?.sides?.length===4&&s.river.sides.every(x=>x===0||x===1)&&[null,1,2,3].includes(s.river.passenger)&&extraValid(s);}
const rawSaved=window.openai?.widgetState?.privateContent?.quarter;
const saved=rawSaved?clone(rawSaved):null;
if(saved?.version===2&&saved.progress){for(const id of extraIds){if(!saved.progress[id])saved.progress[id]={level:0,cleared:0};if(!saved[id])saved[id]=newExtra(id,saved.progress[id].level);}saved.mapPage=saved.mapPage===1?1:0;}
let hintRequested=false;
let state=valid(saved)?clone(saved):fresh();
state.undo=Array.isArray(state.undo)?state.undo.filter(a=>a&&['river','hanoi','jugs','bridge','lights','sokoban'].includes(a.id)&&Number.isInteger(a.level)&&a.before&&typeof a.before==='object').slice(-24):[];
const requestedPlace=location.hash.slice(1);if(requestedPlace!=='map'&&Object.hasOwn(titles,requestedPlace))state.view=requestedPlace;
if(saved?.version===1){state.legacy=clone(saved);state.revision=saved.revision||0;for(const id of ['cafe','safe','scales','river'])if(saved.done?.includes(id)||saved[id]?.solved){state.progress[id]={level:1,cleared:1};if(id==='safe')state.safe=newSafe(1);if(id==='scales')state.scales=newScale(1);}}
const oldCafe=window.openai?.widgetState?.privateContent?.lyingMachines;
if(!saved&&oldCafe?.solved)state.progress.cafe={level:1,cleared:1};
function cfg(id=state.view){return levels[id][state.progress[id].level];}
function persist(){state.revision++;while(state.undo.length&&new TextEncoder().encode(JSON.stringify(state)).length>14000)state.undo.shift();try{Promise.resolve(window.openai?.setWidgetState?.({modelContent:{game:'Квартал загадок',place:titles[state.view],levels:state.progress,solved:state.done,attempts:state.safe.log.length,weighings:state.scales.log.length,trips:state.river.trips},privateContent:{quarter:clone(state)}})).catch(()=>{});}catch{}}
function complete(id){const p=state.progress[id];p.cleared=Math.max(p.cleared,p.level+1);if(p.cleared===3&&!state.done.includes(id))state.done.push(id);}
const undoPlaces=['river','hanoi','jugs','bridge','lights','sokoban'];
function canUndo(id){return undoPlaces.includes(id)&&state.undo.some(a=>a.id===id&&a.level===state.progress[id].level);}
function clearUndo(id){state.undo=state.undo.filter(a=>a.id!==id);}
function recordUndo(id){if(!undoPlaces.includes(id))return;state.undo.push({id,level:state.progress[id].level,before:clone(state[id])});if(state.undo.length>24)state.undo.shift();}
function undoMove(){const id=state.view;if(!canUndo(id))return;const index=state.undo.findLastIndex(a=>a.id===id&&a.level===state.progress[id].level),entry=state.undo[index],restored=clone(state);restored[id]=clone(entry.before);if(!valid(restored))return;state[id]=clone(entry.before);state.undo.splice(index,1);state[id].message='Ход отменён.';render();persist();}
function currentSolved(){return state.view!=='map'&&!!state[state.view]?.solved;}
function guide(){const id=state.view;if(id==='map')return 'Нажми на здание. В каждом — три уровня; следующий откроется после решения.';const c=cfg();if(currentSolved())return state.progress[id].level<2?'Решено! Нажми «Дальше», чтобы открыть следующий уровень.':'Все три уровня пройдены. Стрелка ← вернёт в квартал.';
if(extraIds.includes(id))return extraGuide(id);
if(id==='cafe'){const a=state.cafe,condition=['Все наклейки неверны.','Ровно одна наклейка верна.','Наклейки ничего не гарантируют.'][c.mode];return !a?.samples.length?`Узнай, что в каждом автомате. ${condition} Нажми на автомат — проба стоит одну монету.`:'Сравни пробы с условием. Справа выбери чай, кофе или случайный для А, Б и В, затем «Проверить».';}
if(id==='safe'&&state.safe.failed)return 'Попытки закончились. Код открыт справа. Нажми ↻ для повтора.';
if(id==='safe')return `Открой сейф: ${c.digits} разные цифры 0–${c.max}. Нажимай на цифры, затем «Открыть». ● — на месте, ○ — есть, но в другом месте.`;
if(id==='scales'){const a=state.scales;if(a.solved||a.failed)return 'Нажми ↻ для повтора или ← для выхода.';if(a.answerMode)return 'Теперь нажми на монету, которую считаешь фальшивой.';const goal=c.unknown?'одна легче или тяжелее':'одна тяжелее';return a.places.some(x=>x!==0)?'Стрелкой выбери другую чашу, положи столько же монет и нажми «Взвесить».':`Найди фальшивую из ${c.coins} за ${c.limit} взвешивания: ${goal}. Выбери ← чашу и нажми на монеты.`;}
const a=state.river;if(a.failed)return 'Не оставляй опасную пару без фермера. Нажми ↻, чтобы начать заново.';return a.passenger?'Пассажир в лодке. Нажми на лодку, чтобы переплыть.':a.trips?'Нажми на пассажира на своём берегу или плыви один.':`Перевези ${c.active.length===2?'козу и капусту':'волка, козу и капусту'}${c.limit?' за 7 рейсов':''}. Козу нельзя оставлять с капустой${c.active.includes(1)?', а волка — с козой':''}. Нажми на пассажира, затем на лодку.`;}
function tutorial(){
const id=state.view;if(id==='map'||state.progress[id].level!==0)return null;
if(currentSolved())return {target:'[data-level-next]',text:'Готово! Нажми «Дальше». На следующих уровнях подсветки уже не будет.'};
const s=state[id];if(extraIds.includes(id))return extraTutorial(id);if(s?.failed)return {target:`[data-reset="${id}"]`,text:'Не получилось. Нажми ↻ и попробуй ещё раз.'};
if(id==='cafe'){
const mixed=all('.lm-sticker > span:last-child').findIndex(el=>el.textContent==='ЧАЙ / КОФЕ');
const possible=s?[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].filter(v=>v.every((x,i)=>x!==s.labels[i])&&s.samples.every(a=>v[a.index]===2||v[a.index]===a.drink)):[];
if(!s?.samples.length||possible.length>1)return {target:`[data-pour="${mixed<0?0:mixed}"]`,text:'Все наклейки врут. Нажми автомат «ЧАЙ / КОФЕ»: одна проба стоит одну монету.'};
const i=s.guesses.findIndex(x=>x==='');if(i>=0)return {target:`[data-guess="${i}"]`,text:`Проба взята. Выбери содержимое автомата ${['А','Б','В'][i]}. Случайный выдаёт то чай, то кофе.`};
return {target:'[data-check]',text:'Все подписи выбраны. Нажми «Проверить» — узнаем, согласуются ли они с пробой и условием.'};
}
if(id==='safe'){
if(new Set(s.digits).size<s.digits.length)return {target:'[data-digit="1"]',text:'Цифры должны различаться. Нажми вторую цифру, чтобы изменить её.'};
const previous=s.log.at(-1)?.code||[0,1],changed=s.digits.some((x,i)=>x!==previous[i]);
if(changed)return {target:'[data-safe-check]',text:'Нажми «Открыть», чтобы проверить код. ● — цифра на месте, ○ — есть, но в другой позиции.'};
return {target:'[data-digit="0"]',text:s.log.length?'Сравни ● и ○ справа. Нажми цифру, чтобы изменить код, затем проверь ещё раз.':'Открой сейф с двумя разными цифрами 0–3. Нажми подсвеченную цифру: она изменится.'};
}
if(id==='scales'){
if(s.log.length&&!s.answerMode)return {target:'[data-accuse]',text:'Взвешивание закончено. Нажми «Назвать монету», чтобы дать ответ.'};
if(s.log.length){const a=s.log[0],coin=a.result<0?a.left[0]:a.result>0?a.right[0]:s.places.findIndex((_,i)=>!a.left.includes(i)&&!a.right.includes(i));return {target:`[data-coin="${coin}"]`,text:a.result===0?'Вес одинаковый: тяжёлая монета осталась на столе. Нажми на неё — это ответ.':`${a.result<0?'Левая':'Правая'} чаша тяжелее. Нажми на её монету — это ответ.`};}
if(s.answerMode)return {target:'[data-accuse]',text:'Сначала проверим монеты на весах. Нажми эту кнопку ещё раз, чтобы вернуться к раскладке.'};
const left=s.places.flatMap((x,i)=>x===-1?[i]:[]),right=s.places.flatMap((x,i)=>x===1?[i]:[]),free=s.places.findIndex(x=>x===0);
if(!left.length&&!right.length)return s.tray===-1?{target:'[data-coin="0"]',text:'Одна из трёх монет тяжелее. Нажми монету 1, чтобы положить её на левую чашу.'}:{target:'[data-tray="-1"]',text:'Сначала выбери левую чашу.'};
if(!left.length||!right.length){const side=!left.length?-1:1;return s.tray!==side?{target:`[data-tray="${side}"]`,text:`Теперь выбери ${side===-1?'левую':'правую'} чашу стрелкой.`}:{target:`[data-coin="${free}"]`,text:'Нажми свободную монету: она встанет на выбранную чашу.'};}
if(left.length!==right.length){const side=left.length>right.length?-1:1,coin=(side===-1?left:right).at(-1);return s.tray!==side?{target:`[data-tray="${side}"]`,text:'На чашах нужно поровну монет. Выбери чашу, где монет больше.'}:{target:`[data-coin="${coin}"]`,text:'Нажми лишнюю монету ещё раз: она вернётся на стол.'};}
return {target:'[data-weigh]',text:'На чашах по одной монете. Нажми «Взвесить» и сравни их вес.'};
}
if(s.passenger)return {target:'[data-cross]',text:'Пассажир выбран. Нажми на лодку, чтобы перевезти его.'};
if(s.sides[0]===1)return {target:'[data-cross]',text:'Теперь верни фермера одного. Нажми на пустую лодку.'};
const actor=cfg('river').active.find(i=>s.sides[i]===0);return {target:`[data-actor="${actor}"]`,text:s.trips?'Остался второй пассажир. Нажми на него, затем на лодку.':'Перевези козу и капусту. Нажми на козу: она сядет в лодку.'};
}
function syncGuide(){q('[data-level]').innerHTML=state.view==='map'?'':(state.progress[state.view].level+1)+' / 3<span class="qt-level-name"> · '+cfg().name+'</span>';q('[data-level-next]').hidden=state.view==='map'||state.progress[state.view]?.cleared<=state.progress[state.view]?.level||state.progress[state.view]?.level>=2;q('[data-help]').textContent=state.view==='map'?help.map:guide()+(state.view==='river'?' Без фермера нельзя оставлять козу с капустой или волка с козой. Можно плыть одному.':state.view==='scales'?' Нажатие на уже выбранную монету снимает её с чаши. Ответ даётся кнопкой «Назвать монету».':'');all('.qt-teach').forEach(el=>{el.classList.remove('qt-teach');el.removeAttribute('data-tutorial-target');});q('[data-hint-toggle]').textContent='Подсказка';q('[data-hint-toggle]').setAttribute('aria-label',hintRequested?'Скрыть подсказку':'Показать подсказку');q('[data-hint-toggle]').setAttribute('aria-pressed',String(hintRequested));q('[data-undo]').hidden=!undoPlaces.includes(state.view);q('[data-undo]').disabled=!canUndo(state.view);const step=hintRequested?generalHint():tutorial();q('[data-guide]').hidden=!step;q('[data-guide]').textContent=step?.text||'';if(step){const target=q(step.target);if(target&&!target.disabled){target.classList.add('qt-teach');target.setAttribute('data-tutorial-target','');}}}

if(b.dataset.reset){clearUndo(b.dataset.reset);state[b.dataset.reset]=b.dataset.reset==='safe'?newSafe(state.progress.safe.level):b.dataset.reset==='scales'?newScale(state.progress.scales.level):newRiver();render();persist();return;}
if(b.hasAttribute('data-digit')){const s=state.safe;if(s.solved||s.failed)return;s.digits[Number(b.dataset.digit)]=(s.digits[Number(b.dataset.digit)]+1)%(cfg('safe').max+1);s.message='';renderSafe();persist();}
if(b.hasAttribute('data-safe-check')){const s=state.safe;if(s.solved||s.failed)return;if(new Set(s.digits).size<s.secret.length){s.message='Цифры должны различаться.';}else{const bulls=s.digits.filter((v,i)=>v===s.secret[i]).length,cows=s.digits.filter(v=>s.secret.includes(v)).length-bulls;s.log.push({code:s.digits.slice(),bulls,cows});s.solved=bulls===s.secret.length;s.failed=!s.solved&&s.log.length>=cfg('safe').limit;s.message='';if(s.solved)complete('safe');}renderSafe();persist();}
if(b.hasAttribute('data-tray')){const s=state.scales;if(s.solved||s.failed||s.log.length>=cfg('scales').limit)return;s.tray=Number(b.dataset.tray);s.answerMode=false;renderScale();persist();}
if(b.hasAttribute('data-accuse')){const s=state.scales;if(s.solved||s.failed)return;s.answerMode=!s.answerMode;renderScale();persist();}
if(b.hasAttribute('data-coin')){const s=state.scales;if(s.solved||s.failed)return;const i=Number(b.dataset.coin);if(s.answerMode){s.solved=i===s.heavy;s.failed=!s.solved;if(s.solved)complete('scales');}else if(s.log.length<cfg('scales').limit){s.places[i]=s.places[i]===s.tray?0:s.tray;s.message='';}renderScale();persist();}
if(b.hasAttribute('data-weigh')){const s=state.scales;if(s.solved||s.failed||s.log.length>=cfg('scales').limit)return;const left=s.places.flatMap((v,i)=>v===-1?[i]:[]),right=s.places.flatMap((v,i)=>v===1?[i]:[]);if(!left.length||left.length!==right.length)s.message='Положи поровну монет на обе чаши.';else{const result=(left.includes(s.heavy)?-1:right.includes(s.heavy)?1:0)*s.delta;s.log.push({left,right,result});s.message=result===0?'Равновесие.':result<0?'Левая тяжелее.':'Правая тяжелее.';if(s.log.length===cfg('scales').limit)s.answerMode=true;}renderScale();persist();}
if(b.hasAttribute('data-actor')){const s=state.river,i=Number(b.dataset.actor);if(s.solved||s.failed||s.sides[i]!==s.sides[0])return;s.passenger=s.passenger===i?null:i;s.message='';renderRiver();persist();}
if(b.hasAttribute('data-cross')){const s=state.river;if(s.solved||s.failed)return;recordUndo('river');s.sides[0]=1-s.sides[0];if(s.passenger)s.sides[s.passenger]=s.sides[0];s.passenger=null;s.trips++;if(cfg('river').active.includes(1)&&s.sides[1]===s.sides[2]&&s.sides[1]!==s.sides[0]){s.failed=true;s.message='Волк съел козу.';}else if(s.sides[2]===s.sides[3]&&s.sides[2]!==s.sides[0]){s.failed=true;s.message='Коза съела капусту.';}else if([0,...cfg('river').active].every(i=>s.sides[i]===1)){s.solved=true;complete('river');}if(!s.solved&&!s.failed&&cfg('river').limit&&s.trips>=cfg('river').limit){s.failed=true;s.message='Лимит рейсов исчерпан.';}s.message=s.failed?s.message:'';renderRiver();persist();}
});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.quarter;if(valid(s)&&s.revision>state.revision){state=clone(s);render();}});
window.addEventListener('resize',()=>{if(state.view==='map')unifiedMap();});
render();
})();
</script>
