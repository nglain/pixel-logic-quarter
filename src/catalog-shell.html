<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оглавление · Квартал загадок</title>
<style>
:root{color-scheme:dark;--bg:#101b29;--surface:#172536;--line:#304355;--text:#e7e6d5;--muted:#a3b4bc;--gold:#e8c97e;--green:#a5d6bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.page{max-width:1100px;margin:auto;padding:24px}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:20px;font-weight:600;color:var(--gold);text-decoration:none}.top p{margin:3px 0 0;color:var(--muted);font-size:13px}.game-link,.play{color:var(--bg);background:var(--green);padding:8px 14px;text-decoration:none;display:inline-block;border:1px solid var(--green);white-space:nowrap}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:30px;align-items:start}
.toc{max-height:calc(100vh - 128px);overflow-y:auto;padding-right:12px;scrollbar-width:thin;scrollbar-color:#40586a transparent}.group{margin:0 0 18px}.group h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;font-weight:500}.entry{width:100%;border:0;background:transparent;color:var(--text);text-align:left;display:flex;align-items:center;gap:10px;padding:5px 6px;margin:1px 0;min-height:38px}.entry:hover{background:#203346}.entry[aria-current="true"]{background:#253c4a;color:var(--gold)}.entry-label{flex:1;font-size:13px}.entry-state{width:6px;height:6px;flex-shrink:0;background:var(--green);border-radius:50%}.entry-state.planned{background:transparent;border:1px solid #607585}.icon{display:inline-block;flex-shrink:0;width:32px;height:32px;background-image:url('@@ATLAS@@');background-size:600% 500%;background-repeat:no-repeat;image-rendering:auto}.icon.hero{width:112px;height:112px}.detail-head{display:flex;gap:20px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:4px}h1{font-size:28px;line-height:1.15;margin:0 0 6px;font-weight:600}.classic{color:var(--muted);font-size:14px}.badge{display:inline-block;font-size:11px;padding:2px 7px;margin-top:9px;border:1px solid #3d5d57;color:var(--green)}.badge.planned{border-color:#465466;color:#b8becb}.badge.priority{border-color:#6b5c3c;color:var(--gold);margin-left:5px}.lead{font-size:17px;line-height:1.5;margin:20px 0 16px;color:#f0e7cb}.goal{margin-bottom:20px}.goal strong,.label{display:block;text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:500;color:var(--muted);margin:0 0 5px}.goal p{margin:0}.detail-body{max-width:700px}.section{margin:20px 0}.section h2{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--gold)}.section p{margin:0}.section ol{padding-left:20px;margin:0;display:grid;gap:6px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.level-list{list-style:none;padding:0;margin:0;display:grid;gap:0}.level-list li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.level-no{color:var(--gold);font-variant-numeric:tabular-nums}.proposal-note{font-size:12px;color:var(--muted);margin-bottom:6px}.note{font-size:13px;border-left:2px solid #776941;padding-left:12px;color:#c4c5bd}.footer{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.footer a{color:var(--muted)}.mobile-select{display:none}.catalog-count{font-variant-numeric:tabular-nums}.legend{display:flex;gap:12px;align-items:center;margin-top:4px;font-size:11px;color:var(--muted)}.legend span{display:flex;gap:5px;align-items:center}
@media(max-width:760px){.page{padding:16px}.layout{grid-template-columns:200px minmax(0,1fr);gap:20px}.detail-head{gap:12px}.icon.hero{width:84px;height:84px}h1{font-size:24px}.two-cols{grid-template-columns:1fr;gap:0}.top{align-items:start}.game-link{font-size:12px;padding:7px 9px}}
@media(max-width:560px){.page{padding:14px}.top{gap:8px;margin-bottom:14px}.brand{font-size:18px}.top p{font-size:12px}.top .game-link{display:none}.layout{display:block}.toc{display:none}.mobile-select{display:block;width:100%;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px;font:inherit}.detail-head{gap:12px}.icon.hero{width:80px;height:80px}h1{font-size:23px}.lead{font-size:16px;margin-top:16px}.footer{flex-wrap:wrap}.legend{flex-wrap:wrap;gap:6px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<main class="page" id="catalog">
  <header class="top"><div><a href="catalog.html" class="brand">Квартал загадок</a><p>Оглавление · <span class="catalog-count" data-counts></span></p><div class="legend"><span><i class="entry-state" aria-hidden="true"></i> Уже в игре</span><span><i class="entry-state planned" aria-hidden="true"></i> Предложено</span></div></div><a class="game-link" href="index.html">Открыть квартал →</a></header>
  <select class="mobile-select" data-mobile aria-label="Выбрать головоломку"></select>
  <div class="layout"><nav class="toc" aria-label="Оглавление головоломок" data-toc></nav><article class="detail" data-detail aria-live="polite"></article></div>
  <footer class="footer"><span>Иконки созданы через ImageGen.</span><a href="docs/CATALOG.md">Текстовое оглавление</a><a href="index.html">Вернуться к игре</a></footer>
</main>
<script type="application/json" id="catalog-data">@@DATA@@</script>
<script>
(()=>{
const root=document.getElementById('catalog'),q=s=>root.querySelector(s),data=JSON.parse(document.getElementById('catalog-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sprite=(item,big=false)=>`<span class="icon${big?' hero':''}" style="background-position:${item.icon%6*20}% ${Math.floor(item.icon/6)*25}%" aria-hidden="true"></span>`;
let selected=data.items.some(i=>i.id===location.hash.slice(1))?location.hash.slice(1):'sokoban';
q('[data-counts]').textContent=`${data.items.length} задач · ${data.items.filter(i=>i.status==='playable').length} уже можно пройти`;
q('[data-toc]').innerHTML=data.groups.map(g=>{const items=data.items.filter(i=>i.group===g.id);return `<section class="group"><h2><span>${esc(g.title)}</span><span>${items.length}</span></h2>${items.map(i=>`<button class="entry" data-select="${i.id}" aria-current="false">${sprite(i)}<span class="entry-label">${esc(i.title)}</span><span class="entry-state ${i.status==='playable'?'':'planned'}" aria-label="${i.status==='playable'?'Уже в игре':'Предложено'}"></span></button>`).join('')}</section>`;}).join('');
q('[data-mobile]').innerHTML=data.groups.map(g=>`<optgroup label="${esc(g.title)}">${data.items.filter(i=>i.group===g.id).map(i=>`<option value="${i.id}">${esc(i.title)} · ${i.status==='playable'?'в игре':'предложено'}</option>`).join('')}</optgroup>`).join('');
function render(save=false){const i=data.items.find(i=>i.id===selected),g=data.groups.find(g=>g.id===i.group),live=i.status==='playable';root.querySelectorAll('[data-select]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.select===selected)));q('[data-mobile]').value=selected;
q('[data-detail]').innerHTML=`<div class="detail-head">${sprite(i,true)}<div><div class="eyebrow">${esc(g.title)}</div><h1>${esc(i.title)}</h1><div class="classic">${esc(i.classic)}</div><span class="badge ${live?'':'planned'}">${live?'Уже в игре · 3 уровня':'Предложено · ещё не реализовано'}</span>${i.priority?'<span class="badge priority">Первая очередь</span>':''}</div></div><div class="detail-body"><p class="lead">${esc(i.summary)}</p><div class="goal"><strong>Цель</strong><p>${esc(i.goal)}</p></div><div class="two-cols"><section class="section"><h2>Правила</h2><ol>${i.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></section><section class="section"><h2>Как управлять</h2><p>${esc(i.controls)}</p><div class="section"><span class="label">Что тренирует</span><p>${esc(i.thinking)}</p></div></section></div><section class="section"><h2>От простого к сложному</h2>${!live?'<p class="proposal-note">Предлагаемая структура уровней, не готовые игровые сцены.</p>':''}<ul class="level-list">${i.levels.map((l,k)=>`<li><span class="level-no">0${k+1}</span><span>${esc(l)}</span></li>`).join('')}</ul></section><section class="section"><h2>${live?'Как помогает подсказка':'Как может помогать подсказка'}</h2><p>${esc(i.hint)}</p></section>${i.note?`<p class="note">${esc(i.note)}</p>`:''}${live?`<a class="play" href="index.html#${i.id}">Играть →</a>`:'<p class="proposal-note">Эта задача включена в оглавление как идея для развития квартала.</p>'}</div>`;
if(save)history.replaceState(null,'','#'+selected);
}
root.addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b){selected=b.dataset.select;render(true);}});
q('[data-mobile]').addEventListener('change',e=>{selected=e.target.value;render(true);});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(data.items.some(i=>i.id===id)){selected=id;render();}});
render();
})();
</script></body></html>
